name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm make python3 qemu-system-x86 fdisk dosfstools

      - name: Run lint and contract checks
        run: make lint

      - name: Run benchmark regression checks
        run: make bench-check

      - name: Build benchmark trend
        if: always()
        run: make bench-trend

      - name: Append benchmark summary
        if: always()
        run: |
          if [ -f benchmark/latest-summary.txt ]; then
            {
              echo "## Benchmark Summary"
              echo '```text'
              cat benchmark/latest-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "No benchmark summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f benchmark/trend-latest.txt ]; then
            {
              echo "## Benchmark Trend"
              echo '```text'
              cat benchmark/trend-latest.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            benchmark/baseline.txt
            benchmark/results-*.txt
            benchmark/results-*.json
            benchmark/summary-*.txt
            benchmark/latest-results.txt
            benchmark/latest-results.json
            benchmark/latest-summary.txt
            benchmark/trend-latest.txt
            benchmark/trend-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build full OS image
        run: make full

      - name: Boot smoke test (headless QEMU)
        run: |
          # Strict: this step must not silently skip on the CI runner.
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || { echo "qemu-system-x86_64 not installed on the runner"; exit 1; }
          bash tests/test_boot.sh mellivora.img

      - name: HBFS fsck (fresh image, strict)
        run: |
          mkdir -p .build
          truncate -s 2G .build/fresh.img
          python3 populate.py .build/fresh.img programs
          python3 tools/fsck_hbfs.py .build/fresh.img --strict

      - name: Runtime assertions over serial console
        run: |
          python3 tools/qemu_drive.py mellivora.img "time_test" \
            --expect TIME_OK --reject TIME_FAIL
          python3 tools/qemu_drive.py mellivora.img "syscall_test arg" \
            --expect SYSCALL_OK --reject SYSCALL_FAIL
          python3 tools/qemu_drive.py mellivora.img "hello &" --then "ps" \
            --expect "No background jobs"

      - name: 100 MB heap workload (P1 exit gate)
        run: make check-heap

      - name: Run test suite
        run: make check

      - name: Upload disk image artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mellivora-img-${{ github.sha }}
          path: mellivora.img
          retention-days: 7

  longmode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # gcc is the x86-64 C compiler for the nucleus on this x86-64 host;
          # tools/find_lm_toolchain.sh also accepts x86_64-elf-gcc or clang.
          sudo apt-get install -y nasm make python3 gcc binutils qemu-system-x86

      - name: Build 64-bit image
        run: make 64bit

      - name: Build 64-bit image with the asm nucleus
        run: make 64bit-asm

      - name: Asm-nucleus boot test
        run: python3 tests/test_longmode.py mellivora64-asm.img --marker-only

      - name: Long-mode boot test
        run: make check-longmode

  sixtyfour:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # The nucleus is freestanding C11: it needs an x86-64 compiler even
          # though the runner's own gcc would produce the right architecture,
          # because the probe accepts the distro cross package first.
          sudo apt-get install -y nasm make python3 qemu-system-x86 \
            gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu

      - name: Show the toolchain the build will use
        run: |
          echo "cc: $(sh tools/find_lm_toolchain.sh cc)"
          echo "ld: $(sh tools/find_lm_toolchain.sh ld)"

      - name: Build the 64-bit image
        run: make 64bit

      - name: 64-bit gate (boot, shell, guest writes)
        run: make check-64

      - name: 64-bit HBFS integrity
        run: python3 tools/fsck_hbfs.py mellivora64.img --strict

      - name: Build and boot the asm nucleus too
        run: |
          make 64bit-asm
          python3 tests/test_longmode.py mellivora64-asm.img --marker-only

  installer-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm make python3 xorriso qemu-system-x86 \
            gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu

      # The disc is the primary way to install the system, so it is built,
      # verified and installed here rather than only on a developer's machine.
      - name: Build and verify the installer disc
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) make iso
          make iso-verify

      - name: Check the disc's structure
        run: python3 tests/test_iso.py

      - name: Install the disc onto a blank disk and boot it
        run: python3 tests/test_iso.py --end-to-end

      - name: Prove a mis-addressed write is rejected
        run: python3 tests/test_installer_verify.py

      - name: Build and check the lite disc
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) make iso-lite
          python3 tests/test_iso.py --iso mellivora-lite.iso \
            --image mellivora-install-lite.img

      - name: Record the disc checksums
        run: |
          sha256sum mellivora.iso mellivora-lite.iso | tee SHA256SUMS

      - name: Upload the checksums
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mellivora-iso-checksums-${{ github.sha }}
          path: SHA256SUMS
          retention-days: 7
